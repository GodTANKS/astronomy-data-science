name: Assemble staged paper PDFs

on:
  push:
    paths:
      - ".github/workflows/assemble-staged-papers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode original PDFs from staged base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p papers/pdf

          cat .paper-upload/orion/part*.txt | base64 -d > papers/pdf/2018-orion-northern-filament-12co.pdf
          cat .paper-upload/space-hazard/part*.txt | base64 -d > papers/pdf/2022-space-hazard-text-mining.pdf
          cat .paper-upload/outer-ring/part*.txt | base64 -d > papers/pdf/2022-outer-ring-galaxy.pdf
          cat .paper-upload/galaxy/part*.txt | base64 -d > papers/pdf/2026-galaxy-classification-deep-learning.pdf

          test "$(stat -c%s papers/pdf/2018-orion-northern-filament-12co.pdf)" = "6258677"
          test "$(stat -c%s papers/pdf/2022-space-hazard-text-mining.pdf)" = "2200709"
          test "$(stat -c%s papers/pdf/2022-outer-ring-galaxy.pdf)" = "5502282"
          test "$(stat -c%s papers/pdf/2026-galaxy-classification-deep-learning.pdf)" = "2178876"

          for f in papers/pdf/*.pdf; do
            head -c 4 "$f" | grep -q '%PDF'
            echo "VERIFIED $(basename "$f") $(stat -c%s "$f") bytes"
          done

      - name: Commit PDFs and remove staging chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/pdf/*.pdf
          git rm -r .paper-upload
          git commit -m "Complete centralized paper PDF library"
          git push
