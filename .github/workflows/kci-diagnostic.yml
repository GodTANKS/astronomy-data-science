name: KCI PDF diagnostic

on:
  push:
    paths:
      - ".github/workflows/kci-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact download function
        shell: python
        run: |
          import re, requests, time

          aid="ART002920862"
          url="https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId="+aid
          headers={"User-Agent":"Mozilla/5.0 Chrome/130 Safari/537.36"}
          r=requests.get(url,headers=headers,timeout=90)
          print("status",r.status_code,"len",len(r.text))
          text=r.text
          needles=["function fncDown","fncDown(","KCI_FI","fileDown","download"]
          for needle in needles:
            print("\n---",needle,"---")
            starts=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
            print("count",len(starts))
            for pos in starts[:20]:
              print(text[max(0,pos-800):pos+1800].replace("\n"," ")[:2600])
