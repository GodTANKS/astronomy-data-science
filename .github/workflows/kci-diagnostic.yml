name: KCI PDF diagnostic

on:
  push:
    paths:
      - ".github/workflows/kci-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test KCI PDF download endpoint
        shell: python
        run: |
          import re, requests

          aid="ART002920862"
          article="https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId="+aid
          headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"}
          s=requests.Session()
          r=s.get(article,headers=headers,timeout=120)
          print("article",r.status_code,len(r.content),r.url)
          ids=re.findall(r"fncDown\('([^']+)'\)",r.text)
          print("download ids",ids)
          if not ids:
            raise SystemExit("no KCI file id")
          fid=ids[0]
          url="https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiOrteServHistIFrame.kci?sereArticleSearchBean.artiId="+aid+"&sereArticleSearchBean.orteFileId="+fid
          d=s.get(url,headers={**headers,"Referer":article},timeout=120,allow_redirects=True)
          print("download status",d.status_code)
          print("final url",d.url)
          print("content-type",d.headers.get("content-type"))
          print("content-disposition",d.headers.get("content-disposition"))
          print("length",len(d.content))
          print("first100",repr(d.content[:100]))
          if not d.content.startswith(b"%PDF"):
            print("text-preview",d.text[:5000])
