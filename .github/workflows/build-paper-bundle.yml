name: Build paper bundle

on:
  push:
    paths:
      - ".github/workflows/build-paper-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all-papers ZIP
        run: |
          rm -f papers/Cho-Hoon-Papers-8.zip
          zip -j -9 papers/Cho-Hoon-Papers-8.zip papers/pdf/*.pdf
          unzip -t papers/Cho-Hoon-Papers-8.zip
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/Cho-Hoon-Papers-8.zip
          git commit -m "Add downloadable bundle of all 8 papers"
          git push
